<!DOCTYPE html>
<html lang="ml">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>V.C. VIJUSHANTHI - Billing System</title>
  <link rel="icon" type="image/jpeg" href="logo.jpg">
  <link rel="apple-touch-icon" href="logo.jpg">

  <style>
    :root { 
      --primary: #8b0000; 
      --bg: #f4f4f9; 
      --card-bg: #ffffff; 
      --text: #111111;
    }

    body { 
      font-family: 'Segoe UI', Arial, sans-serif; 
      margin: 0; 
      padding: 15px; 
      background-color: var(--bg); 
      color: var(--text);
    }

    .container { 
      max-width: 600px; 
      margin: 0 auto; 
      background: var(--card-bg); 
      padding: 15px; 
      border-radius: 8px; 
      box-shadow: 0 2px 5px rgba(0,0,0,0.1); 
    }

    .header { 
      text-align: center; 
      margin-bottom: 15px; 
    }

    .header img { 
      max-width: 120px; 
      height: auto; 
      display: block; 
      margin: 0 auto 10px; 
      border-radius: 6px;
    }

    .header h2 { 
      color: var(--primary); 
      margin: 5px 0; 
    }

    .search-box { 
      width: 100%; 
      padding: 10px; 
      border: 1.5px solid var(--primary); 
      border-radius: 6px; 
      margin-bottom: 15px; 
      box-sizing: border-box; 
      font-size: 15px;
    }

    .category-title { 
      color: var(--primary); 
      border-bottom: 2px solid var(--primary); 
      padding-bottom: 5px; 
      margin-top: 20px; 
      font-weight: bold; 
      font-size: 16px;
    }

    .item-row { 
      display: flex !important; 
      justify-content: space-between; 
      align-items: center; 
      padding: 10px 0; 
      border-bottom: 1px solid #eee; 
      color: #000000 !important;
      font-size: 15px;
      font-weight: 500;
    }

    .item-row span {
      color: #000000 !important;
      display: inline-block;
    }

    .item-row input { 
      width: 70px; 
      padding: 6px; 
      text-align: center; 
      border: 1px solid #8b0000; 
      border-radius: 4px; 
      font-size: 14px;
    }

    .btn { 
      width: 100%; 
      background-color: var(--primary); 
      color: white; 
      border: none; 
      padding: 12px; 
      font-size: 16px; 
      font-weight: bold; 
      border-radius: 6px; 
      cursor: pointer; 
      margin-top: 15px; 
    }
    
    @media print {
      .no-print { display: none !important; }
      .container { box-shadow: none; padding: 0; }
      .notes-box textarea { border: 1px solid #000 !important; background: transparent !important; }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <img src="logo.jpg" alt="Logo">
      <h2>V.C. VIJUSHANTHI</h2>
      <p style="margin:2px 0;">VAZHAYIL (H), AYYAMPILLY</p>
      <p style="margin:2px 0;">PHONE: 9447578311</p>
    </div>

    <input type="text" id="searchInput" class="search-box no-print" placeholder="Search item (സാധനങ്ങൾ തിരയുക)..." onkeyup="filterItems()">

    <div class="category-title">പൂജാ ദ്രവ്യങ്ങൾ (Items List)</div>
    <div id="poojaItems">
      <div class="item-row"><span>കദളിപ്പഴം (Kadali Banana)</span><input type="number" placeholder="Qty"></div>
      <div class="item-row"><span>കർപ്പൂരം (Camphor)</span><input type="number" placeholder="Qty"></div>
      <div class="item-row"><span>സാമ്പ്രാണി (Incense)</span><input type="number" placeholder="Qty"></div>
      <div class="item-row"><span>നെയ്യ് (Ghee)</span><input type="number" placeholder="Qty"></div>
      <div class="item-row"><span>മഞ്ഞൾപ്പൊടി (Turmeric)</span><input type="number" placeholder="Qty"></div>
    </div>

    <div class="category-title">മൂലദ്രവ്യങ്ങൾ (Moola Dravyangal)</div>
    <div id="moolaItems">
      <div class="item-row"><span>എള്ളെണ്ണ (Sesame Oil)</span><input type="number" placeholder="Qty"></div>
      <div class="item-row"><span>തേൻ (Honey)</span><input type="number" placeholder="Qty"></div>
      <div class="item-row"><span>മലർ (Malar)</span><input type="number" placeholder="Qty"></div>
    </div>

    <!-- Notes Box for Forgotten Items -->
    <div class="notes-box" style="margin-top: 25px;">
      <label style="font-weight: bold; display: block; margin-bottom: 5px; color: var(--primary);">
        അധിക വിവരങ്ങൾ / വിട്ടുപോയവ (Notes):
      </label>
      <textarea id="extraNotes" rows="3" placeholder="വിട്ടുപോയ സാധനങ്ങളോ മറ്റ് വിവരങ്ങളോ ഇവിടെ ടൈപ്പ് ചെയ്യാം..." style="width: 100%; padding: 8px; border: 1px solid var(--primary); border-radius: 5px; box-sizing: border-box; font-family: sans-serif;"></textarea>
    </div>

    <button class="btn no-print" onclick="window.print()">Generate Bill / Print PDF</button>
  </div>

  <script>
    function filterItems() {
      let input = document.getElementById('searchInput').value.toLowerCase();
      let rows = document.getElementsByClassName('item-row');
      for (let i = 0; i < rows.length; i++) {
        let text = rows[i].getElementsByTagName('span')[0].innerText.toLowerCase();
        rows[i].style.setProperty('display', text.includes(input) ? 'flex' : 'none', 'important');
      }
    }
  </script>

</body>
</html>
